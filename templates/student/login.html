{% extends "student/base.html" %}

{% block title %}Student Sign In - QuizMaster{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="app-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="brand-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.6rem; background: #eef2ff; color: #4f46e5; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center;">
                        <i class="bi bi-mortarboard-fill"></i>
                    </div>
                    <span class="badge bg-primary-subtle text-primary fw-bold px-3 py-1 rounded-pill mb-2">Student Portal</span>
                    <h3 class="fw-bold">Student Sign In</h3>
                    <p class="text-muted small">Enter your student credentials to take quizzes and view your scores</p>
                </div>

                <form method="POST" action="{{ url_for('login', next=request.args.get('next', '')) }}">
                    <div class="mb-3">
                        <label for="email_or_user" class="form-label fw-semibold">Student Email or Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                            <input type="text" class="form-control border-start-0" id="email_or_user" name="email_or_user" required placeholder="e.g. rahul@gmail.com">
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="password" class="form-label fw-semibold mb-0">Password</label>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                            <input type="password" class="form-control border-start-0" id="password" name="password" required placeholder="••••••••">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                        <i class="bi bi-box-arrow-in-right"></i> Sign In to Student Portal
                    </button>

                    <div class="text-center">
                        <span class="text-muted small">New student?</span>
                        <a href="{{ url_for('register') }}" class="fw-bold small text-primary ms-1">Register for an Account</a>
                    </div>
                </form>

                <!-- Student Quick Fill for Demonstration -->
                <div class="mt-4 pt-3 border-top">
                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <small class="text-muted fw-bold text-uppercase" style="font-size: 0.72rem; letter-spacing: 0.05em;">
                            <i class="bi bi-lightning-charge-fill text-warning me-1"></i> Demo Student Account
                        </small>
                    </div>
                    <button type="button" class="btn btn-sm btn-light border text-start w-100 d-flex justify-content-between align-items-center py-2" onclick="fillStudent('rahul@gmail.com', 'rahul123')">
                        <span><i class="bi bi-person-check text-primary me-2"></i><strong>rahul@gmail.com</strong> (Student)</span>
                        <span class="badge bg-primary">Auto Fill</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillStudent(email, pass) {
    document.getElementById('email_or_user').value = email;
    document.getElementById('password').value = pass;
}
</script>
{% endblock %}
