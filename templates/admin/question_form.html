{% extends "admin/base.html" %}

{% block title %}{{ action }} Question - QuizMaster Admin{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="app-card p-4 p-md-5">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <h3 class="fw-bold mb-1">{{ action }} Question</h3>
                        <p class="text-muted small">Configure question text, four multiple-choice options, answer key & explanation</p>
                    </div>
                    <a href="{{ url_for('dashboard') }}" class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Back to Dashboard
                    </a>
                </div>

                <form method="POST">
                    <!-- Quiz Select -->
                    <div class="mb-3">
                        <label for="quiz_id" class="form-label fw-semibold">Target Quiz <span class="text-danger">*</span></label>
                        <select class="form-select" id="quiz_id" name="quiz_id" required>
                            <option value="">-- Select Target Quiz --</option>
                            {% for qz in quizzes %}
                                <option value="{{ qz.id }}" {% if (question and question.quiz_id == qz.id) or (pre_selected_quiz and pre_selected_quiz|int == qz.id) %}selected{% endif %}>
                                    {{ qz.title }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Question Content -->
                    <div class="mb-4">
                        <label for="question" class="form-label fw-semibold">Question Text <span class="text-danger">*</span></label>
                        <textarea class="form-control font-mono" id="question" name="question" rows="3" required placeholder="e.g. Which keyword is used to handle exceptions in Python?">{{ question.question if question else '' }}</textarea>
                    </div>

                    <!-- Options Grid -->
                    <h5 class="fw-bold mb-3"><i class="bi bi-ui-radios text-primary me-2"></i>Answer Options</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="option_a" class="form-label fw-semibold">Option A <span class="text-danger">*</span></label>
                            <input type="text" class="form-control font-mono" id="option_a" name="option_a" required placeholder="Option A text" value="{{ question.option_a if question else '' }}">
                        </div>

                        <div class="col-md-6">
                            <label for="option_b" class="form-label fw-semibold">Option B <span class="text-danger">*</span></label>
                            <input type="text" class="form-control font-mono" id="option_b" name="option_b" required placeholder="Option B text" value="{{ question.option_b if question else '' }}">
                        </div>

                        <div class="col-md-6">
                            <label for="option_c" class="form-label fw-semibold">Option C <span class="text-danger">*</span></label>
                            <input type="text" class="form-control font-mono" id="option_c" name="option_c" required placeholder="Option C text" value="{{ question.option_c if question else '' }}">
                        </div>

                        <div class="col-md-6">
                            <label for="option_d" class="form-label fw-semibold">Option D <span class="text-danger">*</span></label>
                            <input type="text" class="form-control font-mono" id="option_d" name="option_d" required placeholder="Option D text" value="{{ question.option_d if question else '' }}">
                        </div>
                    </div>

                    <!-- Correct Answer Selection -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold d-block">Correct Answer Key <span class="text-danger">*</span></label>
                        <div class="d-flex flex-wrap gap-4 p-3 bg-light rounded-3 border">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="correct_answer" id="ans_A" value="A" {% if question and question.correct_answer == 'A' %}checked{% endif %} required>
                                <label class="form-check-label fw-bold" for="ans_A">Option A</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="correct_answer" id="ans_B" value="B" {% if (question and question.correct_answer == 'B') or (not question) %}checked{% endif %}>
                                <label class="form-check-label fw-bold" for="ans_B">Option B</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="correct_answer" id="ans_C" value="C" {% if question and question.correct_answer == 'C' %}checked{% endif %}>
                                <label class="form-check-label fw-bold" for="ans_C">Option C</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="correct_answer" id="ans_D" value="D" {% if question and question.correct_answer == 'D' %}checked{% endif %}>
                                <label class="form-check-label fw-bold" for="ans_D">Option D</label>
                            </div>
                        </div>
                    </div>

                    <!-- Explanation -->
                    <div class="mb-4">
                        <label for="explanation" class="form-label fw-semibold">Detailed Solution Explanation (Optional)</label>
                        <textarea class="form-control" id="explanation" name="explanation" rows="2" placeholder="Explain why the correct answer is right so students can learn from mistakes...">{{ question.explanation if question else '' }}</textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('dashboard') }}" class="btn btn-light border">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-check-lg"></i> Save Question
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
