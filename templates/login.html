{% extends "base.html" %}

{% block title %}Sign In - QuizMaster{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="app-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
                        <i class="bi bi-box-arrow-in-right"></i>
                    </div>
                    <h3 class="fw-bold">Welcome Back</h3>
                    <p class="text-muted small">Sign in to start quizzes and view your records</p>
                </div>

                <form method="POST" action="{{ url_for('login', next=request.args.get('next', '')) }}">
                    <div class="mb-3">
                        <label for="email_or_user" class="form-label fw-semibold">Email or Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                            <input type="text" class="form-control border-start-0" id="email_or_user" name="email_or_user" required placeholder="admin@quizmaster.com or rahul@gmail.com">
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="password" class="form-label fw-semibold mb-0">Password</label>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                            <input type="password" class="form-control border-start-0" id="password" name="password" required placeholder="••••••••">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                        <i class="bi bi-box-arrow-in-right"></i> Sign In
                    </button>

                    <div class="text-center">
                        <span class="text-muted small">Don't have an account?</span>
                        <a href="{{ url_for('register') }}" class="fw-bold small text-primary ms-1">Register Now</a>
                    </div>
                </form>

                <!-- Demo Credentials Helper Box for College Presentation / Viva -->
                <div class="mt-4 pt-3 border-top">
                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <small class="text-muted fw-bold text-uppercase" style="font-size: 0.72rem; letter-spacing: 0.05em;">
                            <i class="bi bi-info-circle me-1"></i> Demo Quick Login
                        </small>
                    </div>
                    <div class="d-flex flex-column gap-2">
                        <button type="button" class="btn btn-sm btn-light border text-start d-flex justify-content-between align-items-center" onclick="fillCredentials('admin@quizmaster.com', 'admin123')">
                            <span><i class="bi bi-shield-lock text-danger me-1"></i> Admin: <strong>admin@quizmaster.com</strong></span>
                            <span class="badge bg-danger">Fill</span>
                        </button>
                        <button type="button" class="btn btn-sm btn-light border text-start d-flex justify-content-between align-items-center" onclick="fillCredentials('rahul@gmail.com', 'rahul123')">
                            <span><i class="bi bi-person text-primary me-1"></i> Student: <strong>rahul@gmail.com</strong></span>
                            <span class="badge bg-primary">Fill</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillCredentials(email, pass) {
    document.getElementById('email_or_user').value = email;
    document.getElementById('password').value = pass;
}
</script>
{% endblock %}
