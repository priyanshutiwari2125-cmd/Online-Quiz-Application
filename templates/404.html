{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <h1 class="display-1 fw-extrabold text-primary">404</h1>
        <h3 class="fw-bold mb-3">Oops! Page Not Found</h3>
        <p class="text-muted mb-4">The page or quiz resource you are looking for does not exist or has been moved.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary px-4">
            <i class="bi bi-house-door me-1"></i> Return Home
        </a>
    </div>
</div>
{% endblock %}
