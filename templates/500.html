{% extends "base.html" %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <h1 class="display-1 fw-extrabold text-danger">500</h1>
        <h3 class="fw-bold mb-3">Internal Server Error</h3>
        <p class="text-muted mb-4">Something went wrong on the server. Please try again later.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary px-4">
            <i class="bi bi-house-door me-1"></i> Return Home
        </a>
    </div>
</div>
{% endblock %}
